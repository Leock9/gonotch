name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # The oldest supported Ubuntu: a binary linked against its GLib and GTK runs on every later release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # First, so a tag missing from CHANGELOG.md fails in seconds rather than after the build
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "${{ github.ref_name }}" > "$RUNNER_TEMP/notes.md"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libgirepository1.0-dev
      - run: make test
      - run: make dist VERSION=${{ github.ref_name }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/gonotch-linux-amd64.tar.gz dist/*.deb dist/SHA256SUMS
          --title "${{ github.ref_name }}" --notes-file "$RUNNER_TEMP/notes.md"
